<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background -->
  <rect width="64" height="64" fill="#050505"/>
  <!-- Crown -->
  <path d="M20 26 L24 18 L32 24 L40 18 L44 26 L44 30 L20 30 Z" fill="#e8a820"/>
  <rect x="20" y="29" width="24" height="3" rx="1" fill="#e8a820"/>
  <!-- Crown dots -->
  <circle cx="24" cy="26" r="1.5" fill="#050505"/>
  <circle cx="32" cy="26" r="1.5" fill="#050505"/>
  <circle cx="40" cy="26" r="1.5" fill="#050505"/>
  <!-- Scissors left blade -->
  <line x1="29" y1="33" x2="16" y2="54" stroke="#e8a820" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Scissors right blade -->
  <line x1="35" y1="33" x2="48" y2="54" stroke="#e8a820" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Scissors pivot -->
  <circle cx="32" cy="35" r="2.5" fill="#e8a820"/>
  <!-- Scissors rings left -->
  <circle cx="18" cy="53" r="4" stroke="#e8a820" stroke-width="2" fill="none"/>
  <!-- Scissors rings right -->
  <circle cx="46" cy="53" r="4" stroke="#e8a820" stroke-width="2" fill="none"/>
</svg>